packages:
  - "apps/*"
  - "packages/*"

peerDependencyRules:
  allowedVersions:
    typescript: '7'

allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: set this to true or false
  prisma: true

minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.13'
  - '@nestjs/swagger@12.1.2'
